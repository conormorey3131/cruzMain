<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Cruz Ireland</title>
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <link rel="canonical" href="https://cruzireland.ie/thanks.html">
    <meta name="description" content="Thank you for subscribing to Cruz Ireland. Stay tuned for updates on car meets and events across Ireland.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        .thanks-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('images/cork_night.jpg') no-repeat center center;
            background-size: cover;
            padding: var(--spacing-md);
        }
        .thanks-content {
            background-color: rgba(30, 30, 30, 0.9);
            padding: var(--spacing-xl) var(--spacing-lg);
            border-radius: var(--border-radius-lg);
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: var(--shadow-lg);
        }
        .thanks-content h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: var(--text-color);
            margin-bottom: var(--spacing-sm);
            letter-spacing: 0.1em;
        }
        .thanks-content p {
            font-size: 1.25rem;
            color: var(--gray-color);
            margin-bottom: var(--spacing-lg);
        }
        .thanks-content .btn {
            display: inline-block;
            padding: var(--spacing-sm) var(--spacing-lg);
            font-size: 1.1rem;
        }
        .thanks-icon {
            font-size: 4rem;
            color: var(--success-color);
            margin-bottom: var(--spacing-md);
        }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0B5MEHN1D7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0B5MEHN1D7');
    </script>
</head>
<body>
    <main class="thanks-page">
        <div class="thanks-content">
            <div class="thanks-icon">
                <i class="fas fa-check-circle" aria-hidden="true"></i>
            </div>
            <h1>Thank You!</h1>
            <p>Your email has been submitted successfully. We'll keep you updated on upcoming Cruz Ireland events.</p>
            <a href="index.html" class="btn">
                <i class="fas fa-home" aria-hidden="true"></i> Back to Home
            </a>
        </div>
    </main>
</body>
</html>
